<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - 선호 조건 - 디딤</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="glass-app" data-page="signup-password">
  <header class="topbar">
    <div class="container topbar__inner">
      <a href="index.html" class="logo"><span class="logo__mark">D</span><span>디딤</span></a>
      <a href="login.html" class="btn btn-ghost btn-sm">로그인으로</a>
    </div>
  </header>
  <main class="container auth-wrap">
    <div class="auth-card">
      <p class="signup-step-label">STEP 4 / 5</p>
      <div class="signup-progress" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <h1>선호 조건</h1>
      <p class="lead">선호하는 지역을 알려주시면 더 정확하게 추천해 드려요. (선택 사항)</p>
      <form id="signup-form" novalidate>
        <div class="form-group">
          <label>선호 지역 (복수 선택)</label>
          <div class="chip-select">
            <label><input type="checkbox" name="region" value="전국"> 전국</label>
            <label><input type="checkbox" name="region" value="서울"> 서울</label>
            <label><input type="checkbox" name="region" value="경기"> 경기</label>
            <label><input type="checkbox" name="region" value="인천"> 인천</label>
            <label><input type="checkbox" name="region" value="부산"> 부산</label>
            <label><input type="checkbox" name="region" value="대구"> 대구</label>
            <label><input type="checkbox" name="region" value="대전"> 대전</label>
            <label><input type="checkbox" name="region" value="광주"> 광주</label>
            <label><input type="checkbox" name="region" value="울산"> 울산</label>
            <label><input type="checkbox" name="region" value="세종"> 세종</label>
            <label><input type="checkbox" name="region" value="강원"> 강원</label>
            <label><input type="checkbox" name="region" value="충북"> 충북</label>
            <label><input type="checkbox" name="region" value="충남"> 충남</label>
            <label><input type="checkbox" name="region" value="전북"> 전북</label>
            <label><input type="checkbox" name="region" value="전남"> 전남</label>
            <label><input type="checkbox" name="region" value="경북"> 경북</label>
            <label><input type="checkbox" name="region" value="경남"> 경남</label>
            <label><input type="checkbox" name="region" value="제주"> 제주</label>
          </div>
        </div>
        <div class="signup-nav">
          <a href="signup-career.html" class="btn btn-outline">이전</a>
          <button type="submit" class="btn btn-primary btn-block">다음</button>
        </div>
      </form>
    </div>
  </main>
  <script src="js/api.js?v=20260714-5"></script>
  <script src="js/main.js?v=20260713-4"></script>
</body>
</html>
