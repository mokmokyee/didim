<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="디딤 프로그램 검색·필터">
  <title>프로그램 - 디딤</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="glass-app" data-page="programs">
  <a href="#main" class="sr-only">본문으로 건너뛰기</a>
  <header class="topbar">
    <div class="container topbar__inner">
      <a href="index.html" class="logo" aria-label="디딤 홈"><span class="logo__mark" aria-hidden="true">D</span><span>디딤</span></a>
      <nav class="top-nav" aria-label="주 메뉴">
        <a href="index.html" data-nav="home">홈</a>
        <a href="programs.html" data-nav="programs">프로그램</a>
        <a href="recommend.html" data-nav="recommend">맞춤</a>
        <a href="saved.html" data-nav="saved">저장목록</a>
        <a href="mypage.html" data-nav="mypage">마이페이지</a>
      </nav>
      <div class="topbar__actions">
        <a href="login.html" class="btn btn-ghost btn-sm">로그인</a>
        <a href="signup.html" class="btn btn-navy btn-sm">시작하기 <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </header>
  <div id="filter-backdrop" class="filter-backdrop"></div>
  <main id="main" class="container" style="padding-top:12px;padding-bottom:40px">
    <div class="page-title">
      <h1>프로그램</h1>
      <p>장학금과 공모전을 검색하고 조건에 맞게 골라보세요.</p>
    </div>
    <form id="programs-search-form" class="search-bar" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label for="programs-search" class="sr-only">프로그램 검색</label>
      <input id="programs-search" type="search" placeholder="프로그램명, 키워드 검색">
      <button type="button" id="search-clear" class="btn btn-ghost btn-sm">초기화</button>
      <button type="submit" class="btn btn-primary btn-sm">검색</button>
    </form>
    <div id="active-filters" class="filter-tags"></div>
    <div class="programs-layout">
      <aside id="filter-panel" class="filter-panel" aria-label="검색 필터">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <h2>필터</h2>
          <button type="button" id="filter-close" class="btn btn-ghost btn-sm">닫기</button>
        </div>
        <div class="filter-group">
          <h3>프로그램 유형</h3>
          <label class="filter-option"><input type="checkbox" name="type" value="전체" checked> 전체</label>
          <label class="filter-option"><input type="checkbox" name="type" value="장학금"> 장학금</label>
          <label class="filter-option"><input type="checkbox" name="type" value="공모전"> 공모전</label>
        </div>
        <div class="filter-group">
          <h3>모집 대상</h3>
          <label class="filter-option"><input type="checkbox" name="target" value="고등학생"> 고등학생</label>
          <label class="filter-option"><input type="checkbox" name="target" value="대학생"> 대학생</label>
        </div>
        <div class="filter-group">
          <h3>관심 분야</h3>
          <label class="filter-option"><input type="checkbox" name="category" value="교육"> 교육</label>
          <label class="filter-option"><input type="checkbox" name="category" value="IT·기술"> IT·기술</label>
          <label class="filter-option"><input type="checkbox" name="category" value="디자인"> 디자인</label>
          <label class="filter-option"><input type="checkbox" name="category" value="예술"> 예술</label>
          <label class="filter-option"><input type="checkbox" name="category" value="환경"> 환경</label>
          <label class="filter-option"><input type="checkbox" name="category" value="사회공헌"> 사회공헌</label>
          <label class="filter-option"><input type="checkbox" name="category" value="창업"> 창업</label>
          <label class="filter-option"><input type="checkbox" name="category" value="금융"> 금융</label>
          <label class="filter-option"><input type="checkbox" name="category" value="마케팅"> 마케팅</label>
          <label class="filter-option"><input type="checkbox" name="category" value="콘텐츠"> 콘텐츠</label>
        </div>
        <div class="filter-group">
          <h3>지역</h3>
          <label class="filter-option"><input type="checkbox" name="region" value="전국"> 전국</label>
          <label class="filter-option"><input type="checkbox" name="region" value="서울"> 서울</label>
          <label class="filter-option"><input type="checkbox" name="region" value="경기"> 경기</label>
          <label class="filter-option"><input type="checkbox" name="region" value="인천"> 인천</label>
          <label class="filter-option"><input type="checkbox" name="region" value="부산"> 부산</label>
          <label class="filter-option"><input type="checkbox" name="region" value="대구"> 대구</label>
          <label class="filter-option"><input type="checkbox" name="region" value="대전"> 대전</label>
          <label class="filter-option"><input type="checkbox" name="region" value="광주"> 광주</label>
          <label class="filter-option"><input type="checkbox" name="region" value="울산"> 울산</label>
          <label class="filter-option"><input type="checkbox" name="region" value="세종"> 세종</label>
          <label class="filter-option"><input type="checkbox" name="region" value="강원"> 강원</label>
          <label class="filter-option"><input type="checkbox" name="region" value="충북"> 충북</label>
          <label class="filter-option"><input type="checkbox" name="region" value="충남"> 충남</label>
          <label class="filter-option"><input type="checkbox" name="region" value="전북"> 전북</label>
          <label class="filter-option"><input type="checkbox" name="region" value="전남"> 전남</label>
          <label class="filter-option"><input type="checkbox" name="region" value="경북"> 경북</label>
          <label class="filter-option"><input type="checkbox" name="region" value="경남"> 경남</label>
          <label class="filter-option"><input type="checkbox" name="region" value="제주"> 제주</label>
        </div>
        <div class="filter-actions">
          <button type="button" id="filter-reset" class="btn btn-outline btn-sm">초기화</button>
          <button type="button" id="filter-apply" class="btn btn-primary btn-sm">적용</button>
        </div>
      </aside>
      <section>
        <div class="toolbar">
          <p id="result-count" class="result-count">총 <strong>0</strong>개</p>
          <div style="display:flex;gap:8px;align-items:center">
            <button type="button" id="filter-toggle" class="btn btn-outline btn-sm filter-toggle">필터</button>
            <label class="sr-only" for="sort-select">정렬</label>
            <select id="sort-select" class="sort-select">
              <option value="recommend">추천순</option>
              <option value="views">조회수순</option>
              <option value="deadline">마감 임박순</option>
            </select>
          </div>
        </div>
        <div id="programs-list"></div>
      </section>
    </div>
  </main>
  <nav class="bottom-nav" aria-label="모바일 메뉴">
    <a href="index.html" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-9.5z"/></svg>홈</a>
    <a href="programs.html" data-nav="programs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="13" width="7" height="7" rx="1.5"/><rect x="14" y="13" width="7" height="7" rx="1.5"/></svg>프로그램</a>
    <a href="recommend.html" data-nav="recommend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.2 4.5 5 .7-3.6 3.5.9 5L12 14.8 7.5 16.7l.9-5L4.8 8.2l5-.7L12 3z"/></svg>맞춤</a>
    <a href="saved.html" data-nav="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>저장목록</a>
    <a href="mypage.html" data-nav="mypage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M5 19.5c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>마이</a>
  </nav>
  <script src="js/api.js?v=20260713-1"></script>
  <script src="js/main.js?v=20260713-9"></script>
</body>
</html>
