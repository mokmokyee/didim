<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 디딤</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="glass-app" data-page="login">
  <header class="topbar">
    <div class="container topbar__inner">
      <a href="index.html" class="logo"><span class="logo__mark">D</span><span>디딤</span></a>
      <a href="index.html" class="btn btn-ghost btn-sm">홈으로</a>
    </div>
  </header>
  <main class="container auth-wrap">
    <div class="auth-card">
      <h1>로그인</h1>
      <p class="lead">Google 계정으로 디딤을 시작해 보세요. 맞춤 추천과 마감 알림을 받을 수 있어요.</p>
      <button type="button" id="google-login" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 16.1 4 9.2 8.5 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.1 39.5 16 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l.1.1 6.2 5.2C39.2 37.1 44 32 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
        Google 계정으로 계속하기
      </button>
      <p style="text-align:center;font-size:0.86rem;color:var(--muted);margin:8px 0 16px">
        아직 회원이 아니신가요? Google로 시작하면 회원가입으로 이어집니다.
      </p>
      <ul class="benefit-list">
        <li>관심 분야에 맞는 장학금·공모전 추천</li>
        <li>저장한 프로그램 마감일 알림</li>
        <li>프로필을 수정해 추천을 계속 개선</li>
      </ul>
      <a href="signup.html" class="btn btn-outline btn-block">회원가입 정보 입력하기</a>
    </div>
  </main>
  <script src="js/api.js?v=20260714-4"></script>
  <script src="js/main.js?v=20260713-4"></script>
</body>
</html>
